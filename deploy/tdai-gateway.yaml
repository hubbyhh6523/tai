# Derived from the config generated by official start-memory-core.sh, with embedding enabled.
# Core only substitutes ${VAR} when it is the WHOLE string value, so baseUrl/model are literals.
# If you change DIM / model in docker-compose.yml, change dimensions/model here too
# (Core drops and rebuilds its vector tables when they change).
deployMode: standalone
stateBackend: local

server:
  port: 8420
  host: 0.0.0.0

data:
  baseDir: /data/tdai-memory

llm:
  baseUrl: "${MEMORY_LLM_BASE_URL}"
  apiKey: "${MEMORY_LLM_API_KEY}"
  model: "${MEMORY_LLM_MODEL}"
  maxTokens: 32000
  timeoutMs: 300000

memory:
  promptMode: "${MEMORY_PROMPT_MODE}"
  capture: { enabled: true }
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
    triggerMode: current
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid
    timeoutMs: 5000
  storeBackend: sqlite
  embedding:
    provider: openai
    baseUrl: http://embed-svc:8090/v1
    apiKey: "${EMBED_API_KEY}"
    model: bge-small-zh-v1.5
    dimensions: 512
  bm25:
    enabled: true
    language: zh

skill:
  enabled: true
  routing:
    mode: bm25 # hybrid/embedding also work now that memory.embedding is on
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
    queue:
      backend: local
      keyPrefix: tdai
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
  resources:
    maxResourceSizeBytes: 5000000
