# embed-svc + memory-core + memory-hub + memory-proxy with embedding enabled.
# Do NOT run the official start-memory-core.sh / start-all.sh next to this file: they regenerate
# tdai-gateway.yaml with `embedding.provider: none` and replace the tdai-memory-core container.
name: tdai-embed

services:
  embed-svc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # crates.io mirror for the Rust build, e.g. https://rsproxy.cn (empty = upstream)
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-}
    image: tdai/embed-svc:local
    container_name: tdai-embed-svc
    restart: unless-stopped
    environment:
      PORT: "8090"
      # Inside a container the service must bind 0.0.0.0 for Docker's port
      # mapping to reach it; the host side is loopback-only (see ports below)
      # and API_KEY is required, so this is not a public exposure.
      BIND_ADDR: "0.0.0.0"
      MODEL_DIR: /model
      # MODEL_QUANTIZED=true loads model_quantized.onnx (Xenova int8, ~24 MB);
      # MODEL_FILE overrides with an explicit filename — leave it empty when
      # MODEL_QUANTIZED is set, an explicit MODEL_FILE wins over MODEL_QUANTIZED.
      MODEL_QUANTIZED: ${MODEL_QUANTIZED:-false}
      MODEL_FILE: ${MODEL_FILE:-}
      MODEL_NAME: bge-small-zh-v1.5
      DIM: "512"
      THREADS: ${EMBED_THREADS:-4}
      MAX_BATCH: "256"
      MAX_CHARS: "5000"
      MAX_TOKENS_PER_RUN: ${MAX_TOKENS_PER_RUN:-8192}
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-0}
      BATCH_MAX_TEXTS: ${BATCH_MAX_TEXTS:-32}
      BATCH_MAX_REQUESTS: ${BATCH_MAX_REQUESTS:-8}
      MAX_BODY_MB: ${MAX_BODY_MB:-4}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
      # Set to "true" to make the process exit (and restart via
      # restart: unless-stopped) as soon as /health goes 503.
      HEALTH_EXIT_ON_UNHEALTHY: ${HEALTH_EXIT_ON_UNHEALTHY:-false}
      API_KEY: ${EMBED_API_KEY:?set EMBED_API_KEY in .env}
      CACHE_MAX_MB: ${CACHE_MAX_MB:-64}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-200000}
      CACHE_TTL_SECS: ${CACHE_TTL_SECS:-0}
    volumes:
      - ${EMBED_MODEL_DIR:-./models/bge-small-zh-v1.5}:/model:ro
    ports:
      - "127.0.0.1:${EMBED_PORT:-8090}:8090" # loopback only: /metrics and manual checks
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    networks:
      tdai-memory-stack:
        aliases: [embed-svc]

  memory-core:
    image: ${MEMORY_CORE_IMAGE:-agentmemory/memory-core:latest}
    container_name: tdai-memory-core
    restart: unless-stopped
    depends_on:
      embed-svc:
        condition: service_healthy
    ports:
      - "${MEMORY_CORE_PORT:-8420}:8420"
    volumes:
      - memory-core-data:/data/tdai-memory
      - ./tdai-gateway.yaml:/data/config/tdai-gateway.yaml:ro
    environment:
      TDAI_GATEWAY_PORT: "8420"
      TDAI_GATEWAY_HOST: 0.0.0.0
      # Keep empty while the official Proxy is used (known incompatibility, see official start-memory-core.sh).
      TDAI_GATEWAY_API_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:-}
      TDAI_DATA_DIR: /data/tdai-memory
      STORE_MODE: sqlite
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:?set MEMORY_LLM_BASE_URL in .env}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:?set MEMORY_LLM_API_KEY in .env}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:?set MEMORY_LLM_MODEL in .env}
      MEMORY_PROMPT_MODE: ${MEMORY_PROMPT_MODE:-code}
      EMBED_API_KEY: ${EMBED_API_KEY:?set EMBED_API_KEY in .env}
    networks:
      tdai-memory-stack:
        aliases: [memory-core]

  memory-hub:
    image: ${MEMORY_HUB_IMAGE:-agentmemory/memory-hub:latest}
    container_name: tdai-memory-hub
    restart: unless-stopped
    depends_on:
      memory-core:
        condition: service_started
    ports:
      - "127.0.0.1:${PANEL_PORT:-8125}:8125" # loopback only: admin panel
      - "127.0.0.1:${KNOWLEDGE_PORT:-8424}:8424" # loopback only: wiki / code-graph
    volumes:
      - memory-hub-data:/data/knowledge
      # Hub rejects "local" (the upstream doc's value) on /v3/meta/* with 401 invalid_user_key.
      # It needs a real Core user key, which only exists after init-admin.sh. Reading it from
      # the file keeps the key out of the environment and out of this file.
      - ./.admin-key:/run/tdai/admin-key:ro
    # Wrap the stock entrypoint so the key is read at start time instead of build time.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'REMOTE_INSTANCE_KEY="$$(cat /run/tdai/admin-key)"; export REMOTE_INSTANCE_KEY; exec /usr/local/bin/start-combined.sh'
    environment:
      PANEL_PORT: "8125"
      KNOWLEDGE_PORT: "8424"
      # Hub talks to Core over the compose network alias, never host.docker.internal.
      REMOTE_INSTANCE_URL: http://memory-core:8420
      KNOWLEDGE_PUBLIC_BASE_URL: http://127.0.0.1:${KNOWLEDGE_PORT:-8424}/v3
      LLM_MODE: custom
      LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:?set MEMORY_LLM_BASE_URL in .env}
      LLM_API_KEY: ${MEMORY_LLM_API_KEY:?set MEMORY_LLM_API_KEY in .env}
      LLM_MODEL: ${MEMORY_LLM_MODEL:?set MEMORY_LLM_MODEL in .env}
    networks:
      tdai-memory-stack:
        aliases: [memory-hub]

  # LLM request proxy (:8096): auth -> sessionInit -> memory injection -> upstream.
  # No build section: this repo does not vendor the Proxy sources, and
  # agentmemory/memory-proxy:latest is not pullable from CN registries. Build it once from
  # the upstream MemoryProxy/ directory and tag it as ${MEMORY_PROXY_IMAGE} (default below).
  memory-proxy:
    image: ${MEMORY_PROXY_IMAGE:-memory-proxy:local}
    container_name: tdai-proxy
    restart: unless-stopped
    depends_on:
      memory-core:
        condition: service_started
    ports:
      - "127.0.0.1:${PROXY_PORT:-8096}:8096" # loopback only: LLM proxy
    volumes:
      - memory-proxy-data:/data
      # Mounted 644, not 600: the proxy image runs as uid 10001 and cannot read a 600 file.
      - ./proxy-config.yaml:/data/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      tdai-memory-stack:
        aliases: [memory-proxy]

networks:
  tdai-memory-stack:
    name: tdai-memory-stack # same name the official scripts use

volumes:
  memory-core-data:
    name: ${MEMORY_CORE_VOLUME:-tdai-memory-core-data}
  memory-hub-data:
    name: ${MEMORY_HUB_VOLUME:-tdai-panel-data}
  memory-proxy-data:
    name: ${MEMORY_PROXY_VOLUME:-tdai-proxy-data}
